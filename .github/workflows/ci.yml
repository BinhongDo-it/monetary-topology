name: ci

# Turned off 2026-08-21. Nothing is deleted: every step below still says what
# it used to check, and one line restores it. It fired on every push and every
# pull request and its findings were re-runs of work already done on the
# machine that did it. The one check that could only run here, a regenerated
# RESULTS.md against the committed copy, no longer has anything to compare:
# RESULTS.md is kept by hand and is not generated from the records.
#
# To put it back, replace the `workflow_dispatch` block with:
#     push:
#       branches: [main]
#     pull_request:
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check .
      - name: tests
        run: pytest -q
      # Every experiment exits non-zero if a criterion fails, so the published
      # claims are re-checked on each commit rather than trusted.
      - name: criteria
        run: |
          python experiments/a0_retention.py
          python experiments/a0_derived_wages.py
          python experiments/a2_support_contraction.py
          python experiments/a2c_cycle_structure.py
      # B2 is deliberately absent: it needs a multi-gigabyte download from
      # ffiec.cfpb.gov. Its analysis module is covered by the test suite against
      # constructions with known answers, which is what CI can check.
      - name: results file is current
        run: |
          python scripts/render_results.py
          git diff --exit-code RESULTS.md

      # The records themselves, not only the summary rendered from them.
      #
      # `RESULTS.md` alone does not catch a writer that changed without its
      # record being re-run: `a6_siphon_cost.json` gained a whole `criteria`
      # block on 2026-08-13 and nothing failed, because that block does not
      # reach a heading. The runner ratchet, retired 2026-08-21, asked whether
      # a job *could* regenerate a record; this asks whether the committed one
      # equals what the job *does* produce.
      #
      # Scoped to exactly the four this workflow can afford to re-run. The rest
      # stay uncovered and that is visible here rather than assumed away.
      - name: the records this workflow regenerates are current
        run: |
          git diff --exit-code \
            results/a0_retention.json \
            results/a0_derived_wages.json \
            results/a2_support_contraction.json \
            results/a2c_cycle_structure.json
