name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check .
      - name: tests
        run: pytest -q
      # Every experiment exits non-zero if a criterion fails, so the published
      # claims are re-checked on each commit rather than trusted.
      - name: criteria
        run: |
          python experiments/a0_retention.py
          python experiments/a0_derived_wages.py
          python experiments/a2_support_contraction.py
          python experiments/a2c_cycle_structure.py
      # B2 is deliberately absent: it needs a multi-gigabyte download from
      # ffiec.cfpb.gov. Its analysis module is covered by the test suite against
      # constructions with known answers, which is what CI can check.
      - name: results file is current
        run: |
          python scripts/render_results.py
          git diff --exit-code RESULTS.md
