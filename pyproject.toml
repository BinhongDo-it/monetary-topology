[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monetary-topology"
version = "0.1.0"
description = "Mechanism models for a topological framework of claims and resources"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Pinned exactly. See requirements.txt for why: committed figures and records
# have to render to identical bytes, and a floating dependency defeats that.
dependencies = [
    "numpy==2.5.1",
    "matplotlib==3.11.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
